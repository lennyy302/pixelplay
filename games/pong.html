<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Play Pong against the CPU in your browser. Drag, use W/S, and chase the longest rally.">
  <title>Pong · PixelPlay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body class="game-page">
  <header class="game-top">
    <a class="icon-btn back-btn" href="../arcade.html" aria-label="Back to all games">←</a>
    <div class="game-heading">
      <h1>🏓 Pong</h1>
      <p>First to seven</p>
    </div>
    <div class="game-actions">
      <span class="best-pill">🏆 <b data-best="pong">0</b></span>
      <button class="icon-btn" data-sound-toggle aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>
  </header>

  <main class="game-main">
    <section class="stage " id="stage" style="--stage-w:680px;--ar:1.5;--g1:#14b8a6;--g2:#22d3ee">
    <canvas id="game" width="600" height="400" aria-label="Pong court"></canvas>
    <div class="veil" id="overlay">
      <div class="veil-card">
        <div class="veil-icon" id="ovIcon">🏓</div>
        <h2 id="ovTitle">Pong</h2>
        <p id="ovText">Move with the mouse, drag your finger, or use <b>W / S</b>.<br>First to <b>7</b> wins. Long rallies score bragging rights.</p>
        <button class="btn primary" id="ovBtn">Play</button>
      </div>
    </div>
    </section>

    <div class="hud">
      <div class="hud-chip">You <b id="playerScore">0</b></div>
      <div class="hud-chip">CPU <b id="cpuScore">0</b></div>
      <div class="hud-chip">Rally <b id="best" data-best="pong">0</b></div>
      <button class="hud-chip" id="pauseBtn">⏸ Pause</button>
    </div>

    <p class="hint">Drag on the court or use <kbd>W</kbd>/<kbd>S</kbd> (or <kbd>↑</kbd><kbd>↓</kbd>). <kbd>P</kbd> pauses.</p>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/games/pong.js"></script>
</body>
</html>
