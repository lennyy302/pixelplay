<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Play Tic-Tac-Toe against an unbeatable minimax AI, or switch to easy mode.">
  <title>Tic-Tac-Toe · PixelPlay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body class="game-page">
  <header class="game-top">
    <a class="icon-btn back-btn" href="../arcade.html" aria-label="Back to all games">←</a>
    <div class="game-heading">
      <h1>⭕ Tic-Tac-Toe</h1>
      <p>Can you beat the CPU?</p>
    </div>
    <div class="game-actions">
      <span class="best-pill">🏆 <b data-best="tictactoe">0</b></span>
      <button class="icon-btn" data-sound-toggle aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>
  </header>

  <main class="game-main">
    <section class="stage padded" id="stage" style="--stage-w:400px;--ar:1;--g1:#f59e0b;--g2:#fbbf24">
    <div class="ttt-grid" id="tttGrid" aria-label="Tic-tac-toe board"></div>
    <p class="status-line" id="status">Your turn — you're X.</p>
    </section>

    <div class="hud">
      <div class="hud-chip">Wins <b id="wins">0</b></div>
      <div class="hud-chip">Losses <b id="losses">0</b></div>
      <div class="hud-chip">Draws <b id="draws">0</b></div>
      <button class="hud-chip" id="newRoundBtn">↻ New round</button>
    </div>

  <div class="controls-row" aria-label="Difficulty">
    <div class="seg">
      <button type="button" data-level="easy">Easy</button>
      <button type="button" data-level="hard" class="active">Hard</button>
    </div>
  </div>
    <p class="hint">You're <b>X</b> and you always go first. Hard mode uses a perfect minimax AI — a draw is a win.</p>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/games/tictactoe.js"></script>
</body>
</html>
