<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Play Snake in your browser with swipe, arrow keys and on-screen controls.">
  <title>Snake · PixelPlay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body class="game-page">
  <header class="game-top">
    <a class="icon-btn back-btn" href="../arcade.html" aria-label="Back to all games">←</a>
    <div class="game-heading">
      <h1>🐍 Snake</h1>
      <p>Eat, grow, don't crash</p>
    </div>
    <div class="game-actions">
      <span class="best-pill">🏆 <b data-best="snake">0</b></span>
      <button class="icon-btn" data-sound-toggle aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>
  </header>

  <main class="game-main">
    <section class="stage " id="stage" style="--stage-w:460px;--ar:1;--g1:#22c55e;--g2:#a3e635">
    <canvas id="game" width="400" height="400" aria-label="Snake board"></canvas>
    <div class="veil" id="overlay">
      <div class="veil-card">
        <div class="veil-icon" id="ovIcon">🐍</div>
        <h2 id="ovTitle">Snake</h2>
        <p id="ovText">Swipe, tap the arrows, or use <b>WASD / arrow keys</b>.<br>Eat the fruit. Don't crash.</p>
        <button class="btn primary" id="ovBtn">Play</button>
      </div>
    </div>
    </section>

    <div class="hud">
      <div class="hud-chip">Score <b id="score">0</b></div>
      <div class="hud-chip">Best <b id="best" data-best="snake">0</b></div>
      <button class="hud-chip" id="pauseBtn">⏸ Pause</button>
    </div>

  <div class="touch-controls" aria-label="Snake controls">
    <div class="dpad">
      <button class="touch-btn up" data-dir="up" aria-label="Up">▲</button>
      <button class="touch-btn left" data-dir="left" aria-label="Left">◀</button>
      <button class="touch-btn down" data-dir="down" aria-label="Down">▼</button>
      <button class="touch-btn right" data-dir="right" aria-label="Right">▶</button>
    </div>
  </div>
    <p class="hint">Swipe on the board, tap the arrows, or use <kbd>WASD</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>. Press <kbd>Space</kbd> to pause.</p>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/games/snake.js"></script>
</body>
</html>
