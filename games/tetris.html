<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Play Tetris in your browser with touch controls, ghost pieces and saved high scores.">
  <title>Tetris · PixelPlay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body class="game-page">
  <header class="game-top">
    <a class="icon-btn back-btn" href="../arcade.html" aria-label="Back to all games">←</a>
    <div class="game-heading">
      <h1>🧱 Tetris</h1>
      <p>Stack blocks, clear lines</p>
    </div>
    <div class="game-actions">
      <span class="best-pill">🏆 <b data-best="tetris">0</b></span>
      <button class="icon-btn" data-sound-toggle aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>
  </header>

  <main class="game-main">
    <section class="stage " id="stage" style="--stage-w:360px;--ar:0.5;--g1:#8b5cf6;--g2:#6366f1">
    <canvas id="game" width="300" height="600" aria-label="Tetris board"></canvas>
    <div class="veil" id="overlay">
      <div class="veil-card">
        <div class="veil-icon" id="ovIcon">🧱</div>
        <h2 id="ovTitle">Tetris</h2>
        <p id="ovText">Move with <b>← →</b>, rotate with <b>↑</b>, drop with <b>Space</b>.<br>Clear lines. Chase the high score.</p>
        <button class="btn primary" id="ovBtn">Play</button>
      </div>
    </div>
    </section>

    <div class="hud">
      <div class="hud-chip">Score <b id="score">0</b></div>
      <div class="hud-chip">Lines <b id="lines">0</b></div>
      <div class="hud-chip">Level <b id="level">1</b></div>
      <div class="hud-chip">Best <b id="best" data-best="tetris">0</b></div>
      <div class="next-chip">Next <canvas id="next" width="84" height="84" aria-label="Next piece"></canvas></div>
      <button class="hud-chip" id="pauseBtn">⏸ Pause</button>
    </div>

  <div class="touch-controls" aria-label="Tetris controls">
    <button class="touch-btn" data-action="left" aria-label="Move left">◀</button>
    <button class="touch-btn" data-action="rotate" aria-label="Rotate">⟳</button>
    <button class="touch-btn" data-action="right" aria-label="Move right">▶</button>
    <button class="touch-btn" data-action="down" aria-label="Soft drop">▼</button>
    <button class="touch-btn accent" data-action="drop" aria-label="Hard drop">⤓</button>
  </div>
    <p class="hint">Keyboard: <kbd>←</kbd><kbd>→</kbd> move, <kbd>↑</kbd> rotates, <kbd>↓</kbd> soft drops, <kbd>Space</kbd> hard drops, <kbd>P</kbd> pauses.</p>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/games/tetris.js"></script>
</body>
</html>
