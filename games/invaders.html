<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Play a Space Invaders-style shooter in your browser with touch controls and endless waves.">
  <title>Invaders · PixelPlay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body class="game-page">
  <header class="game-top">
    <a class="icon-btn back-btn" href="../arcade.html" aria-label="Back to all games">←</a>
    <div class="game-heading">
      <h1>👾 Invaders</h1>
      <p>Hold the line</p>
    </div>
    <div class="game-actions">
      <span class="best-pill">🏆 <b data-best="invaders">0</b></span>
      <button class="icon-btn" data-sound-toggle aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>
  </header>

  <main class="game-main">
    <section class="stage " id="stage" style="--stage-w:480px;--ar:0.8;--g1:#a855f7;--g2:#ec4899">
    <canvas id="game" width="480" height="600" aria-label="Invaders game"></canvas>
    <div class="veil" id="overlay">
      <div class="veil-card">
        <div class="veil-icon" id="ovIcon">👾</div>
        <h2 id="ovTitle">Invaders</h2>
        <p id="ovText">Move with the mouse, drag, or <b>← →</b>. Fire with <b>Space</b>.<br>Clear every wave. Don't let them land.</p>
        <button class="btn primary" id="ovBtn">Play</button>
      </div>
    </div>
    </section>

    <div class="hud">
      <div class="hud-chip">Score <b id="score">0</b></div>
      <div class="hud-chip heart">Lives <b id="lives">♥♥♥</b></div>
      <div class="hud-chip">Wave <b id="wave">1</b></div>
      <div class="hud-chip">Best <b id="best" data-best="invaders">0</b></div>
      <button class="hud-chip" id="pauseBtn">⏸ Pause</button>
    </div>

  <div class="touch-controls" aria-label="Invaders controls">
    <button class="touch-btn" data-move="left" aria-label="Move left">◀</button>
    <button class="touch-btn accent wide" id="fireBtn" aria-label="Fire">FIRE</button>
    <button class="touch-btn" data-move="right" aria-label="Move right">▶</button>
  </div>
    <p class="hint">Drag on the board or use <kbd>←</kbd><kbd>→</kbd>. Fire with <kbd>Space</kbd> or the FIRE button. <kbd>P</kbd> pauses.</p>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/games/invaders.js"></script>
</body>
</html>
