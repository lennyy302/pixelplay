<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Play Simon in your browser. Watch the colour sequence, repeat it, and see how many rounds you last.">
  <title>Simon · PixelPlay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body class="game-page">
  <header class="game-top">
    <a class="icon-btn back-btn" href="../arcade.html" aria-label="Back to all games">←</a>
    <div class="game-heading">
      <h1>🎵 Simon</h1>
      <p>Watch, remember, repeat</p>
    </div>
    <div class="game-actions">
      <span class="best-pill">🏆 <b data-best="simon">0</b></span>
      <button class="icon-btn" data-sound-toggle aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>
  </header>

  <main class="game-main">
    <section class="stage padded" id="stage" style="--stage-w:420px;--ar:1;--g1:#06b6d4;--g2:#3b82f6">
    <div class="simon-grid" id="simonGrid" aria-label="Simon pads">
      <button class="simon-pad green" data-pad="0" aria-label="Green pad"></button>
      <button class="simon-pad red" data-pad="1" aria-label="Red pad"></button>
      <button class="simon-pad yellow" data-pad="2" aria-label="Yellow pad"></button>
      <button class="simon-pad blue" data-pad="3" aria-label="Blue pad"></button>
    </div>
    <p class="status-line" id="status">Watch, remember, repeat.</p>
    <div class="veil" id="overlay">
      <div class="veil-card">
        <div class="veil-icon" id="ovIcon">🎵</div>
        <h2 id="ovTitle">Simon</h2>
        <p id="ovText">Watch the colours light up, then repeat the sequence.<br>One new step every round. How far can you go?</p>
        <button class="btn primary" id="ovBtn">Start</button>
      </div>
    </div>
    </section>

    <div class="hud">
      <div class="hud-chip">Round <b id="level">1</b></div>
      <div class="hud-chip">Best <b id="best" data-best="simon">0</b></div>
    </div>

    <p class="hint">Tap the pads in the same order. On a keyboard you can use <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd>.</p>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/games/simon.js"></script>
</body>
</html>
